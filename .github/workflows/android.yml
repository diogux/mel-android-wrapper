name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Build, test and lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Summarize tests
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Android verification\n\n')
              if not reports:
                  summary.write('No JUnit reports produced; inspect the build step.\n')
              for report in sorted(reports):
                  suite = ET.parse(report).getroot()
                  summary.write(f"- **{suite.attrib['name'].split('.')[-1]}**: {suite.attrib['tests']} tests, {suite.attrib['failures']} failures, {suite.attrib['errors']} errors\n")
              summary.write('\nAPKs are published only through the rolling Latest release. CI does not upload unsigned or differently signed builds.\n')
